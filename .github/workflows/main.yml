name: Build Kasir APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instal dependensi
        run: npm install

      - name: Build aplikasi web
        run: npm run build

      - name: Simpan hasil build
        uses: actions/upload-artifact@v4
        with:
          name: kasir-web
          path: dist/
