name: Build Kasir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Periksa file proyek
        run: |
          if [ ! -f package.json ]; then
            echo "ERROR: package.json tidak ditemukan!"
            exit 1
          fi

      - name: Install dependensi
        run: npm install --legacy-peer-deps

      - name: Build aplikasi web
        run: npm run build

      - name: Simpan hasil build
        uses: actions/upload-artifact@v4
        with:
          name: kasir-web
          path: dist/
          if-no-files-found: error
