name: Build Kasir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Periksa proyek
        run: |
          if [ ! -f package.json ]; then
            echo "ERROR: package.json tidak ditemukan"
            exit 1
          fi

      - name: Siapkan Android SDK
        run: |
          echo "Memeriksa Android SDK..."
          test -d "$ANDROID_HOME" || {
            echo "Android SDK tidak ditemukan"
            exit 1
          }

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependensi
        run: npm install --legacy-peer-deps

      - name: Pasang Capacitor
        run: |
          npm install @capacitor/core@^7 \
            @capacitor/cli@^7 \
            @capacitor/android@^7 \
            --save --legacy-peer-deps

      - name: Konfigurasi aplikasi Android
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.fearlucky.kasir",
            "appName": "Kasir",
            "webDir": "dist"
          }
          EOF

      - name: Build aplikasi web
        run: npm run build

      - name: Periksa hasil web
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html tidak ditemukan"
            exit 1
          fi

      - name: Siapkan proyek Android
        run: npx cap add android

      - name: Sinkronisasi Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: kasir-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
